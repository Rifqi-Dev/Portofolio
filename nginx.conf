events {

}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript text/javascript image/svg+xml;

    # Bare host redirects to the canonical www host.
    server {
        listen 8080;
        server_name kapuyuaxdev.my.id;
        return 301 https://www.kapuyuaxdev.my.id$request_uri;
    }

    server {
        listen 8080 default_server;
        server_name www.kapuyuaxdev.my.id localhost 127.0.0.1 _;
        root /usr/share/nginx/html;
        charset utf-8;

        # add_header in a location block drops inherited ones, so shared
        # security headers are repeated where a location adds its own.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location / {
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # SEO / GEO files: real 404 instead of the SPA fallback.
        location = /robots.txt {
            default_type text/plain;
            add_header Cache-Control "public, max-age=3600";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            try_files $uri =404;
        }

        location = /sitemap.xml {
            default_type application/xml;
            add_header Cache-Control "public, max-age=3600";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            try_files $uri =404;
        }

        location ~ ^/llms(-full)?\.txt$ {
            default_type text/plain;
            add_header Cache-Control "public, max-age=3600";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            try_files $uri =404;
        }

        # Icons and images: cache for a day.
        location ~ ^/(favicon.*|android-chrome.*|apple-touch-icon.*|avatar\.png|manifest\.json)$ {
            add_header Cache-Control "public, max-age=86400";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            try_files $uri =404;
        }

        # CRA hashed build output is immutable.
        location /static/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            try_files $uri =404;
        }

        # index.html must always revalidate so new deploys are picked up.
        location = /index.html {
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
